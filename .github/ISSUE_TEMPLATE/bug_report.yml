name: Bug report
description: Something in orangu, orangu-coordinator, or orangu-server does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        Please fill in the machine specs and the model — almost every
        inference bug depends on the exact hardware and GGUF in use, and
        without them we cannot reproduce what you are seeing.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the [existing issues](https://github.com/mnemosyne-systems/orangu/issues) and this is not a duplicate
          required: true
        - label: I reproduced this on the latest release or on the current `main` branch
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the stack is affected? Select all that apply.
      multiple: true
      options:
        - orangu (coding environment / TUI)
        - orangu-server (inference engine)
        - orangu-coordinator (model proxy)
        - orangu-bench
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: |
        Output of `orangu --version` and/or `orangu-server --version`.
        If you built from source, add the commit: `git rev-parse --short HEAD`.
      placeholder: "orangu 0.12.0 (built from main @ b253192)"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      description: |
        The exact GGUF in use, including the quantization — the `MODEL` and
        `QUANT` columns from `orangu-server list`. Use "n/a" only if the bug
        does not involve a model at all.
      placeholder: "unsloth/gemma-4-31B-it-GGUF:Q4_K_M (Q4_K, 17.07 GiB)"
    validations:
      required: true

  - type: textarea
    id: system
    attributes:
      label: Machine specs
      description: |
        Paste the **complete** output of `orangu-server system` — it reports
        the CPU (model, cores, frequency, RAM, SIMD support) and every GPU
        (memory type, VRAM, driver).
      placeholder: |
        $ orangu-server system
        CPU
          Model            : AMD Ryzen 7 4800H with Radeon Graphics
          Vendor           : AuthenticAMD
          Architecture     : x86_64
          Physical cores   : 8
          Logical cores    : 16
          Frequency        : 4.24 GHz
          Memory total     : 62.19 GiB
          Memory available : 46.30 GiB
          SSE4.2           : Yes
          AVX2             : Yes
          AVX512           : No

        GPU
          [0] AMD Navi 14 [Radeon RX 5500/5500M / Pro 5300/5300M/5500M]
              Memory type  : Dedicated
              VRAM total   : 3.98 GiB
              VRAM used    : 210.84 MiB
              Driver       : amdgpu
      render: shell
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend
      description: The `[orangu-server].backend` setting in use (default is `auto`).
      options:
        - auto
        - cpu
        - vulkan
        - cuda
        - opencl
        - rocm
        - Not applicable
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Distribution/OS and version, plus the terminal emulator if the bug is in the TUI.
      placeholder: "Fedora 44, kernel 7.1.3, GNOME Terminal"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you are seeing, and what you expected to see instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands, prompts, and slash commands needed to trigger it.
      placeholder: |
        1. Start the server: `orangu-server unsloth/gemma-4-31B-it-GGUF:Q4_K_M`
        2. Run `orangu` in a workspace
        3. Enter `/review`
        4. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, backtrace, or configuration
      description: |
        Relevant server/client output, a panic backtrace, or the contents of
        your `orangu.conf` / `orangu-server.conf`. Redact anything private —
        this is a public issue tracker.
      render: shell
    validations:
      required: false
