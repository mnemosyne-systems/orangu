[package]
name = "orangu"
version = "2.0.0"
edition = "2024"
# Not the default `./build.rs`: all source in this package lives under `src/`,
# and a build script is source.
build = "src/build.rs"
license = "GPL-3.0-or-later"
description = "A coding environment for OpenAI-compatible servers"
authors = ["Jesper Pedersen <jesperpedersen.db@gmail.com>"]

[[bin]]
name = "orangu"
path = "src/bin/orangu/main.rs"

[[bin]]
name = "orangu-coordinator"
path = "src/bin/orangu-coordinator/main.rs"

[[bin]]
name = "orangu-server"
path = "src/bin/orangu-server/main.rs"

# Developer benchmarking tool (not part of the served product). Measures decode
# tok/s of any OpenAI-compatible server over HTTP — orangu-server or
# llama-server. Documented in doc/manual/en/79-bench.md.
[[bin]]
name = "orangu-bench"
path = "src/bin/orangu-bench/main.rs"

# Builds a model file: trains one from a manifest of permissively-licensed
# repositories, or rewrites an existing one at another weight format.
# Documented in doc/manual/en/77-gguf.md.
[[bin]]
name = "orangu-gguf"
path = "src/bin/orangu-gguf/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false }
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
home = "0.5.12"
html2text = "0.17.4"
ignore = "0.4.34"
globset = "0.4.21"
markdown = "1.0.0"
merman = { version = "0.9.3", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
printpdf = { version = "0.12.8", default-features = false, features = ["text_layout", "png"] }
regex = "1.13"
resvg = { version = "0.49.0", default-features = false, features = ["text", "raster-images"] }
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
rustc-hash = "2.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "blocking"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
http-body = "1.1"
rustyline = "19.0.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
syntect = { version = "5.3.0", features = ["html"] }
terminal_size = "0.4.4"
ttf-parser = "0.25.1"
sha2 = "0.11.1"
tiktoken-rs = "0.12.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5.0"
infer = "0.22.0"
mime_guess = "2.0.5"
base64 = "0.23.1"
pdf-extract = "0.12.1"
pdfni = { version = "0.2.0", default-features = false }
imageproc = { version = "0.27.0", default-features = false }
hayro = "0.8.0"
ocrs = { version = "0.13.1", default-features = false, features = ["onnx"] }
rten = { version = "0.26.0", default-features = false, features = ["onnx_format"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
calamine = "0.37.0"
chrono = "0.4.45"
zip = "9.2.0"
quick-xml = "0.42.0"
strum = "0.28.0"
strum_macros = "0.28.0"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-scala = "0.26"
tree-sitter-ocaml = "0.26"
tree-sitter-julia = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-r = "1.3"
tree-sitter-zig = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-dart = "0.3"
tree-sitter-erlang = "0.21"
petgraph = "0.8.3"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
streaming-iterator = "0.1.9"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-typescript = "0.23.2"
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "component"] }
minijinja = { version = "3.0", features = ["loop_controls", "serde"] }
minijinja-contrib = { version = "3.0", features = ["pycompat"] }
bzip2 = "0.6.1"
flate2 = "1.1"
tar = "0.4"
half = "2.7"
wide = "1.7.1"
memmap2 = "0.9"
rand = "0.10"
async-stream = "0.3"
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "metal", "dx12", "wgsl", "std"] }
ash = "0.38"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
cudarc = { version = "0.19.10", features = ["cuda-12000"] }
opencl3 = "0.12.4"
cubecl-hip-sys = { version = "7", optional = true }
ratatui = "0.30.2"
ansi-to-tui = "8.0.1"
unicode-width = "0.2.3"
if-addrs = "0.15.0"
libloading = "0.9"
fern = "0.7"
log = "0.4"
rten-gemm = "0.27.0"
rten-tensor = "0.27.0"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls-native-certs = "0.8"
httparse = "1"
chrono-tz = "0.10.4"
hmac = "0.13.0"

[features]
rocm = ["dep:cubecl-hip-sys"]
[target.'cfg(unix)'.dependencies]
daemonize = "0.5.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
naga = { version = "30.0.1", features = ["wgsl-in", "msl-out"] }

[profile.release-with-debug]
inherits = "release"
debug = 1
panic = "unwind"
