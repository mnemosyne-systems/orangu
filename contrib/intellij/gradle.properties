# The plugin's version. The release job sets it from the tag.
pluginVersion = 2.1.0

# The oldest IDE the plugin supports, and the one it is built and tested
# against. -PplatformType=IU -PplatformVersion=2026.2.5 tests it against
# another (IntelliJ IDEA is one product, IU, from 2025.3 on).
platformType = IC
platformVersion = 2024.3.6
pluginSinceBuild = 243

# The IDE brings its own Kotlin standard library.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
