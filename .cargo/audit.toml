# Every entry here is an advisory that has been read and accepted. An id whose
# advisory no longer matches the lockfile does not belong in the list: it is
# dead weight that would silently re-suppress the advisory if a dependency ever
# resolved back into the affected range. Check before adding, and drop entries
# once the dependency is patched.
[advisories]
ignore = [
    "RUSTSEC-2024-0320", # yaml-rust is pulled in by syntect
    "RUSTSEC-2025-0141", # bincode is pulled in by syntect
]

# `informational_warnings` is not additive — it *replaces* the set of
# informational advisory kinds that get reported. Narrowing it to
# `["unmaintained"]` therefore did not enable unmaintained warnings, it silently
# discarded every `unsound` one, and two were being hidden that way. Leave it
# unset so the default set applies; if it ever has to be written out, it must
# name every kind, not the one that happens to be of interest that day.
