[orangu-server]
models = ~/models
# model = unsloth/gemma-4-E2B-it-GGUF:Q4_K_M  # required by --daemon; in an
                                            # attached run it pre-selects the
                                            # interactive model picker
# all (or its alias *) binds every network interface; a literal address
# such as 127.0.0.1 binds only that one
host = all
port = 8100
# backend = auto  # auto, cpu, vulkan, metal, cuda, opencl, or rocm — auto tries
                  # every GPU backend built into this binary, in order,
                  # falling back to cpu; on macOS the order starts with
                  # metal, the only GPU API Apple ships; rocm needs
                  # `cargo build --features rocm` (see doc/SERVER.md)
# read_size = 8192  # widen an explicit read of a model file to this many KiB
                    # (8 MiB, the default); 4 disables widening. Throughput is closer
                    # to a step than a slope: below a device-specific request
                    # size every read costs a full round trip, above it the
                    # block layer issues several commands together and
                    # throughput jumps — measured 15-28 MB/s at or below
                    # 512 KiB against 206-214 MB/s from 1 MiB up on one USB
                    # -bridged SSD. Widening measured +36% decode tok/s on a
                    # cold MoE model, and cut the run-to-run spread from
                    # 2.25-8.65 tok/s to 7.89-8.44. Only the explicit
                    # read routes (ORANGU_EXPERT_READ=pread|direct) use it;
                    # the default mapping leaves request size to readahead
# role = all  # all, code, review, explorer, or embedding — used directly by
              # --daemon, and as the pre-selected default of the interactive
              # role prompt otherwise. An explicit
              # --all/--code/--review/--explorer/--embedding always wins
# log_type = console  # console (what the server has always printed) or
                      # file, which appends every line — stamped with a time
                      # and a level, and without the once-a-second progress
                      # a request rewrites on a terminal — to log_path.
                      # What --daemon needs: detached, a console-logging
                      # daemon logs nothing at all
# log_path = orangu-server.log  # the file for log_type = file; defaults to
                                # orangu-server.log in the directory the
                                # server was started from. ~ is expanded, a
                                # missing directory is created, an existing
                                # file is appended to
# Speculative decoding: a second, smaller model guesses the next few tokens
# and this one verifies them in a single forward, keeping the longest prefix it
# would have produced itself. The answer is unchanged; only the time differs.
# The pair must share a vocabulary, and both must be an architecture with a
# multi-position forward — both are checked at startup. Greedy, unconstrained
# requests only. Whether it pays depends on the machine: measure it.
# draft_model = unsloth/gemma-4-E2B-it-GGUF:Q4_K_M
# draft_tokens = 4  # tokens proposed per verification

# The built-in web console. Having this section at all is what enables it —
# remove it and no second listener is bound.
[web]
host = all
port = 8101
# `host` may be left out entirely, in which case it falls back to
# [orangu-server].host — name it only to reach the console somewhere the API
# isn't, e.g. an API on `all` with the console kept on 127.0.0.1
# reexec = yes  # whether the console may load a different model, which
                # restarts this process on it (Unix only)
# delete = yes  # whether the console may delete models; `no` removes the
                # Delete button from every row

# A second, dedicated Prometheus /metrics listener. Having this section at
# all is what enables it — remove it and no third listener is bound.
# [prometheus]
# host = 127.0.0.1  # optional; falls back to [orangu-server].host. Name it to
                    # keep this keyless port off the network the API is on
# port = 8300  # off by default (0 / section absent). Serves the exact same
               # text as the authenticated /metrics above, on its own port —
               # and, unlike every other route, with NO api_key check, even
               # when one is set. Only turn this on where the network is
               # trusted, or reachable only by a scraper.

# Every section other than [orangu-server], [web], and [prometheus] is an
# already-running HTTP MCP service. The web console lists these profiles;
# changes require an orangu-server restart.
