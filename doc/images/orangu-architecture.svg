<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" font-family="'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a7f70"/>
    </marker>
  </defs>

  <!-- card background -->
  <rect x="8" y="8" width="884" height="696" rx="20" fill="#fdfbf7" stroke="#e7ded0" stroke-width="2"/>

  <!-- title -->
  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#2c2620">The orangu stack</text>
  <text x="450" y="76" text-anchor="middle" font-size="14" fill="#8a7f70">Three cooperating programs, one Pure-Rust project</text>

  <!-- you -->
  <rect x="402" y="98" width="96" height="36" rx="18" fill="#efe8dc" stroke="#d8cdba" stroke-width="1.5"/>
  <text x="450" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a4238">You</text>

  <!-- arrow you -> orangu -->
  <line x1="450" y1="134" x2="450" y2="168" stroke="#8a7f70" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- orangu (editor) -->
  <rect x="250" y="170" width="400" height="96" rx="14" fill="#fff2e6" stroke="#e8792b" stroke-width="2"/>
  <text x="270" y="202" font-size="21" font-weight="bold" fill="#c15c12" font-family="'DejaVu Sans Mono', monospace">orangu</text>
  <text x="270" y="228" font-size="13.5" fill="#6b6156">The coding environment: terminal UI, local + Git/forge</text>
  <text x="270" y="248" font-size="13.5" fill="#6b6156">tools, code review, knowledge graph, semantic search.</text>

  <!-- arrow orangu -> coordinator -->
  <line x1="450" y1="266" x2="450" y2="316" stroke="#8a7f70" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="295" font-size="12.5" fill="#8a7f70" font-style="italic">OpenAI/Anthropic-compatible HTTP</text>

  <!-- orangu-coordinator -->
  <rect x="250" y="318" width="400" height="96" rx="14" fill="#eef3fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="270" y="350" font-size="21" font-weight="bold" fill="#3a5f92" font-family="'DejaVu Sans Mono', monospace">orangu-coordinator</text>
  <text x="628" y="343" text-anchor="end" font-size="11.5" fill="#7a90b3" font-style="italic">optional</text>
  <text x="270" y="376" font-size="13.5" fill="#6b6156">On-demand model manager: starts and stops the</text>
  <text x="270" y="396" font-size="13.5" fill="#6b6156">server, swapping the model per role (chat, review …).</text>

  <!-- arrow coordinator -> server -->
  <line x1="450" y1="414" x2="450" y2="450" stroke="#8a7f70" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="437" font-size="12.5" fill="#8a7f70" font-style="italic">OpenAI/Anthropic-compatible HTTP</text>

  <!-- orangu-server, with two more instances stacked behind it -->
  <rect x="264" y="452" width="400" height="96" rx="14" fill="#edf7ef" stroke="#3b8c4e" stroke-width="2"/>
  <rect x="257" y="459" width="400" height="96" rx="14" fill="#edf7ef" stroke="#3b8c4e" stroke-width="2"/>
  <rect x="250" y="466" width="400" height="96" rx="14" fill="#edf7ef" stroke="#3b8c4e" stroke-width="2"/>
  <text x="270" y="498" font-size="21" font-weight="bold" fill="#2c7040" font-family="'DejaVu Sans Mono', monospace">orangu-server</text>
  <text x="270" y="524" font-size="13.5" fill="#6b6156">Native pure-Rust GGUF engine: loading, tokenization,</text>
  <text x="270" y="544" font-size="13.5" fill="#6b6156">the transformer forward pass, sampling, scheduling.</text>

  <!-- tools beside the server -->
  <text x="127" y="456" text-anchor="middle" font-size="11.5" fill="#8f7fb0" font-style="italic">Tools</text>
  <rect x="24" y="466" width="206" height="96" rx="14" fill="#f5f1fa" stroke="#8a6bb8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="40" y="498" font-size="19" font-weight="bold" fill="#6b4f9a" font-family="'DejaVu Sans Mono', monospace">orangu-bench</text>
  <text x="40" y="524" font-size="13" fill="#6b6156">Throughput and latency</text>
  <text x="40" y="544" font-size="13" fill="#6b6156">benchmarking harness.</text>
  <text x="773" y="456" text-anchor="middle" font-size="11.5" fill="#8f7fb0" font-style="italic">Tools</text>
  <rect x="670" y="466" width="206" height="96" rx="14" fill="#f5f1fa" stroke="#8a6bb8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="686" y="498" font-size="19" font-weight="bold" fill="#6b4f9a" font-family="'DejaVu Sans Mono', monospace">orangu-gguf</text>
  <text x="686" y="524" font-size="13" fill="#6b6156">Builds model files:</text>
  <text x="686" y="544" font-size="13" fill="#6b6156">pretraining, quantizing.</text>

  <!-- arrow server -> backends -->
  <line x1="450" y1="562" x2="450" y2="583" stroke="#8a7f70" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- backends layer -->
  <rect x="107" y="587" width="686" height="60" rx="16" fill="#faf7f1" stroke="#ddd2c0" stroke-width="1.5"/>
  <g font-size="13.5" font-weight="bold" fill="#5a5248" text-anchor="middle">
    <rect x="123" y="600" width="82" height="34" rx="17" fill="#f3ede2" stroke="#d8cdba" stroke-width="1.5"/>
    <text x="164" y="622">CPU</text>
    <rect x="215" y="600" width="92" height="34" rx="17" fill="#f3ede2" stroke="#d8cdba" stroke-width="1.5"/>
    <text x="261" y="622">Vulkan</text>
    <rect x="317" y="600" width="84" height="34" rx="17" fill="#f3ede2" stroke="#d8cdba" stroke-width="1.5"/>
    <text x="359" y="622">ROCm</text>
    <rect x="411" y="600" width="84" height="34" rx="17" fill="#f3ede2" stroke="#d8cdba" stroke-width="1.5"/>
    <text x="453" y="622">CUDA</text>
    <rect x="505" y="600" width="84" height="34" rx="17" fill="#f3ede2" stroke="#d8cdba" stroke-width="1.5"/>
    <text x="547" y="622">Metal</text>
    <rect x="599" y="600" width="96" height="34" rx="17" fill="#f3ede2" stroke="#d8cdba" stroke-width="1.5"/>
    <text x="647" y="622">OpenCL</text>
    <rect x="705" y="600" width="72" height="34" rx="17" fill="#f3ede2" stroke="#d8cdba" stroke-width="1.5"/>
    <text x="741" y="622">NPU</text>
  </g>
  <text x="450" y="672" text-anchor="middle" font-size="12.5" font-weight="bold" font-style="italic" fill="#8a7f70">One native stack — fully local, fully private, entirely your own</text>
</svg>
